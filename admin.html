<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Zero Waste &amp; Pandansimo</title>
<link rel="stylesheet" href="theme.css">
<style>
body{background:var(--sand);}
.admin-shell{min-height:100vh;display:flex;flex-direction:column;}
.admin-login{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
.admin-login .card{max-width:380px;width:100%;}
.admin-login h1{font-size:1.3rem;text-align:center;}
.admin-login .btn{width:100%;justify-content:center;margin-top:8px;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:.85rem;font-weight:600;color:var(--navy);}
.field input{font-family:inherit;font-size:.95rem;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;}
.field input:focus{outline:none;border-color:var(--green);}
.err{background:#fdecec;color:#9b2c2c;border:1px solid #f3c6c6;border-radius:8px;padding:10px 14px;font-size:.85rem;margin-bottom:10px;}

.topbar{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 22px;}
.topbar .brand{font-family:'Fraunces',serif;font-weight:700;font-size:1.05rem;}
.topbar .btn.ghost{border-color:rgba(255,255,255,.5);color:#fff;}
.topbar .btn.ghost:hover{background:#fff;color:var(--navy);}

.admin-body{flex:1;display:flex;min-height:0;}
.pagelist{
  width:280px;flex:0 0 auto;background:#fff;border-right:1px solid var(--line);
  overflow-y:auto;padding:14px;
}
.pagelist button{
  display:block;width:100%;text-align:left;background:none;border:none;
  padding:10px 12px;border-radius:8px;cursor:pointer;font-size:.88rem;color:var(--ink);
  margin-bottom:2px;
}
.pagelist button:hover{background:var(--sand);}
.pagelist button.active{background:var(--green);color:#fff;font-weight:600;}
.pagelist .count{font-size:.72rem;opacity:.7;}

.editor{flex:1;overflow-y:auto;padding:28px 32px;}
.editor-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.editor-head h2{margin:0;}
.fieldcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;}
.fieldcard .flabel{font-size:.8rem;color:var(--muted);margin-bottom:10px;}
.fieldcard .langrow{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;margin-bottom:10px;}
.fieldcard .langrow:last-child{margin-bottom:0;}
.fieldcard .badge{
  width:32px;height:28px;border-radius:6px;background:var(--sand);color:var(--navy);
  display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;
}
.fieldcard textarea{
  width:100%;font-family:inherit;font-size:.9rem;padding:9px 12px;border-radius:8px;
  border:1px solid var(--line);resize:vertical;min-height:44px;
}
.fieldcard textarea:focus{outline:none;border-color:var(--green);}
.fieldcard .encell{display:flex;flex-direction:column;gap:6px;}
.translatebtn{
  align-self:flex-start;font-size:.76rem;font-weight:600;padding:5px 11px;border-radius:6px;
  border:1px solid var(--line);background:var(--sand);color:var(--navy);cursor:pointer;
}
.translatebtn:hover{background:#e8f3fc;border-color:var(--green);}
.translatebtn:disabled{opacity:.6;cursor:wait;}
.imgcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.imgcard .thumb{width:100px;height:72px;border-radius:8px;object-fit:cover;background:var(--sand);flex:0 0 auto;border:1px solid var(--line);}
.imgcard .thumb.round{width:72px;height:72px;border-radius:50%;}
.imgcard .thumb.videothumb{display:flex;align-items:center;justify-content:center;font-size:1.8rem;}
.imgcard .vstatus{font-size:.82rem;color:var(--muted);margin-bottom:8px;}
.imgcard .vstatus a{color:var(--green-dark);font-weight:600;}
.imgcard .meta{flex:1;min-width:160px;}
.imgcard .meta .flabel{font-size:.85rem;font-weight:600;color:var(--navy);margin-bottom:6px;}
.imgcard .uprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.imgcard input[type=file]{font-size:.82rem;}
.imgcard .ustatus{font-size:.78rem;color:var(--muted);}
.section-label{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:24px 0 10px;}
.section-label:first-child{margin-top:0;}
.savebar{
  position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);
  padding:14px 32px;display:flex;align-items:center;gap:14px;
}
.savebar .status{font-size:.85rem;color:var(--muted);}
.empty-state{padding:60px 20px;text-align:center;color:var(--muted);}

.artlist-item{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;margin-bottom:10px;display:flex;gap:14px;align-items:center;}
.artlist-item img{width:72px;height:52px;object-fit:cover;border-radius:6px;background:var(--sand);flex:0 0 auto;}
.artlist-item .info{flex:1;min-width:0;}
.artlist-item .info .ttl{font-weight:600;font-size:.92rem;margin-bottom:2px;}
.artlist-item .info .sub{font-size:.78rem;color:var(--muted);}
.artlist-item .acts{display:flex;gap:8px;flex:0 0 auto;}
.artform{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;}
.artform h3{margin:0 0 14px;font-size:1rem;}
.artform .field{margin-bottom:12px;}
.artform .field label{display:block;font-size:.8rem;font-weight:600;color:var(--navy);margin-bottom:5px;}
.artform input[type=text], .artform textarea{
  width:100%;font-family:inherit;font-size:.9rem;padding:9px 12px;border-radius:8px;
  border:1px solid var(--line);resize:vertical;
}
.artform .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.artform .row2 .field{margin-bottom:0;}
.artform .actbar{display:flex;gap:10px;align-items:center;margin-top:14px;}
.btn.small{font-size:.82rem;padding:7px 14px;}
.btn.danger{background:#b23a2e;color:#fff;border-color:#b23a2e;}
.btn.danger:hover{background:#962f25;}
@media (max-width:640px){.artform .row2{grid-template-columns:1fr;}}
</style>
</head>
<body class="admin-shell" data-page="admin.html">

<div id="loginView" class="admin-login">
  <div class="card">
    <h1>Masuk Admin</h1>
    <p style="text-align:center;font-size:.9rem;">Khusus pengelola situs Zero Waste &amp; Pandansimo.</p>
    <div id="loginMsg"></div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" autocomplete="username" autocapitalize="off" autocorrect="off">
    </div>
    <div class="field">
      <label>Kata Sandi</label>
      <input type="password" id="loginPass" autocomplete="current-password">
    </div>
    <button class="btn primary" id="loginBtn">Masuk</button>
  </div>
</div>

<div id="editorView" style="display:none;flex-direction:column;flex:1;min-height:0;">
  <div class="topbar">
    <span class="brand">Admin — Zero Waste &amp; Pandansimo</span>
    <div style="display:flex;gap:10px;align-items:center;">
      <a href="index.html" class="btn ghost small" target="_blank">Lihat Situs</a>
      <button class="btn ghost small" id="logoutBtn">Keluar</button>
    </div>
  </div>
  <div class="admin-body">
    <nav class="pagelist" id="pageList"></nav>
    <div class="editor" id="editor">
      <div class="empty-state">Pilih halaman di sebelah kiri untuk mulai mengedit.</div>
    </div>
  </div>
  <div class="savebar" id="saveBar" style="display:none;">
    <button class="btn primary" id="saveBtn">Simpan Perubahan Halaman Ini</button>
    <span class="status" id="saveStatus"></span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
var PAGE_TITLES = {
  'index.html':'Beranda',
  'zw-tentang.html':'Zero Waste — Apa itu Zero Waste',
  'zw-hierarki.html':'Zero Waste — Hierarki',
  'zw-gerakan-dunia.html':'Zero Waste — Gerakan Dunia',
  'zw-gerakan-indonesia.html':'Zero Waste — Gerakan Indonesia',
  'zw-rekayasa-hijau.html':'Zero Waste — Rekayasa Hijau',
  'pandansimo-profil.html':'Pandansimo — Profil & Sejarah',
  'pandansimo-potensi.html':'Pandansimo — Potensi Kawasan',
  'pandansimo-masterplan.html':'Pandansimo — Masterplan/Siteplan',
  'pandansimo-implementasi.html':'Pandansimo — Implementasi & Teknologi',
  'pandansimo-kegiatan.html':'Pandansimo — Kegiatan & Dokumentasi',
  'pandansimo-capaian.html':'Pandansimo — Capaian Saat Ini',
  'pandansimo-analisis.html':'Pandansimo — Analisis & Evaluasi',
  'pandansimo-solusi.html':'Pandansimo — Tantangan & Solusi',
  'artikel.html':'Artikel',
  'tentang-kami.html':'Tentang Kami',
  'kontak.html':'Kontak',
};

var sb = window.supabase.createClient(window.ZW_SUPABASE_URL, window.ZW_SUPABASE_KEY);
var loginView = document.getElementById('loginView');
var editorView = document.getElementById('editorView');
var loginMsg = document.getElementById('loginMsg');
var pageListEl = document.getElementById('pageList');
var editorEl = document.getElementById('editor');
var saveBar = document.getElementById('saveBar');
var saveStatus = document.getElementById('saveStatus');

var manifest = null;      // dari content-manifest.json (default teks per field)
var overrides = {};       // dari Supabase pz_content: key -> {value_id, value_en}
var imageManifest = null; // dari image-manifest.json (slot gambar per field)
var imagesByPage = {};    // file -> [ {key,label,kind,defaultUrl} ]
var imageUrls = {};       // dari Supabase pz_images: key -> url
var currentPage = null;
var BUCKET = 'pz-uploads';
var ARTICLES_KEY = '__articles__';
var articles = [];        // dari Supabase pz_articles
var editingArticleId = null; // null = form tambah baru, selain itu = sedang edit artikel ini
var TAG_OPTIONS = [
  { id: 'Zero Waste', en: 'Zero Waste' },
  { id: 'Pandansimo', en: 'Pandansimo' },
  { id: 'Rekayasa Hijau', en: 'Green Engineering' },
];

function esc(s){ return String(s==null?'':s).replace(/</g,'&lt;'); }

function renderPageList(){
  var html = '<button type="button" data-file="'+ARTICLES_KEY+'" style="margin-bottom:10px;border:1px dashed var(--green-dark);">+ Kelola Artikel Tambahan' +
    '<div class="count">'+articles.length+' artikel</div></button>' +
    '<div style="height:1px;background:var(--line);margin:4px 0 10px;"></div>';
  Object.keys(PAGE_TITLES).forEach(function(file){
    var n = (manifest[file]||[]).length;
    var ni = (imagesByPage[file]||[]).length;
    var countTxt = n + ' teks' + (ni ? ', ' + ni + ' gambar' : '');
    html += '<button type="button" data-file="'+file+'">'+PAGE_TITLES[file]+
      '<div class="count">'+countTxt+'</div></button>';
  });
  pageListEl.innerHTML = html;
  pageListEl.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ selectPage(b.getAttribute('data-file')); });
  });
}

function selectPage(file){
  currentPage = file;
  pageListEl.querySelectorAll('button').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-file') === file);
  });

  if(file === ARTICLES_KEY){
    editingArticleId = null;
    saveBar.style.display = 'none';
    renderArticlesManager();
    return;
  }

  var fields = manifest[file] || [];
  var images = imagesByPage[file] || [];
  var html = '<div class="editor-head"><h2>'+PAGE_TITLES[file]+'</h2>' +
    '<a href="'+file+'" target="_blank" class="btn ghost small">Lihat Halaman</a></div>';

  if(images.length){
    html += '<div class="section-label">Gambar</div>';
    images.forEach(function(im){
      var url = imageUrls[im.key] || im.defaultUrl || '';
      if(im.kind === 'video'){
        var statusTxt = url ? '<a href="'+esc(url)+'" target="_blank">▶ Lihat video tersimpan</a>' : 'Belum ada video — banner pakai foto biasa.';
        html += '<div class="imgcard" data-imgkey="'+im.key+'" data-kind="video">' +
          '<div class="thumb videothumb">🎬</div>' +
          '<div class="meta"><div class="flabel">'+esc(im.label)+'</div>' +
          '<div class="vstatus">'+statusTxt+'</div>' +
          '<div class="uprow"><input type="file" accept="video/mp4,video/webm,video/quicktime" data-upload="'+im.key+'">' +
          '<span class="ustatus"></span></div></div></div>';
        return;
      }
      var thumbClass = im.kind === 'avatar' ? 'thumb round' : 'thumb';
      html += '<div class="imgcard" data-imgkey="'+im.key+'" data-kind="'+im.kind+'">' +
        (url ? '<img class="'+thumbClass+'" src="'+esc(url)+'">' : '<div class="'+thumbClass+'"></div>') +
        '<div class="meta"><div class="flabel">'+esc(im.label)+'</div>' +
        '<div class="uprow"><input type="file" accept="image/*" data-upload="'+im.key+'">' +
        '<span class="ustatus"></span></div></div></div>';
    });
  }

  if(fields.length){
    html += '<div class="section-label">Teks</div>';
    fields.forEach(function(f){
      var ov = overrides[f.key] || {};
      var valId = ov.value_id != null ? ov.value_id : f.id;
      var valEn = ov.value_en != null ? ov.value_en : f.en;
      html += '<div class="fieldcard" data-key="'+f.key+'">' +
        '<div class="flabel">'+esc(f.label)+'</div>' +
        '<div class="langrow"><div class="badge">ID</div><textarea data-lang="id">'+esc(valId)+'</textarea></div>' +
        '<div class="langrow"><div class="badge">EN</div><div class="encell">' +
          '<textarea data-lang="en">'+esc(valEn)+'</textarea>' +
          '<button type="button" class="translatebtn" data-key="'+f.key+'">↻ Terjemahkan dari ID</button>' +
        '</div></div>' +
        '</div>';
    });
  }

  editorEl.innerHTML = html || '<div class="empty-state">Tidak ada teks atau gambar yang bisa diedit di halaman ini.</div>';
  saveBar.style.display = fields.length ? 'flex' : 'none';
  saveStatus.textContent = '';
  autoGrow();
  wireUploads();
  wireTranslateButtons();
}

function wireTranslateButtons(){
  editorEl.querySelectorAll('.translatebtn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var card = btn.closest('.fieldcard');
      var idTa = card.querySelector('[data-lang="id"]');
      var enTa = card.querySelector('[data-lang="en"]');
      var text = (idTa.value || '').trim();
      if(!text){ return; }
      btn.disabled = true;
      btn.textContent = 'Menerjemahkan...';
      fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=id|en')
        .then(function(r){ return r.json(); })
        .then(function(data){
          var t = data && data.responseData && data.responseData.translatedText;
          if(t){
            enTa.value = t;
            enTa.dispatchEvent(new Event('input'));
          } else {
            alert('Terjemahan gagal, coba lagi atau isi manual.');
          }
        })
        .catch(function(){
          alert('Tidak bisa terhubung ke layanan terjemahan. Isi manual saja untuk field ini, atau coba lagi nanti.');
        })
        .finally(function(){
          btn.disabled = false;
          btn.textContent = '↻ Terjemahkan dari ID';
        });
    });
  });
}

function wireUploads(){
  editorEl.querySelectorAll('[data-upload]').forEach(function(input){
    input.addEventListener('change', function(){
      var key = input.getAttribute('data-upload');
      var file = input.files && input.files[0];
      if(!file) return;
      var card = input.closest('.imgcard');
      var statusEl = card.querySelector('.ustatus');
      statusEl.textContent = 'Mengunggah...';
      var ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      var path = key + '-' + Date.now() + '.' + ext;
      sb.storage.from(BUCKET).upload(path, file, { upsert: true }).then(function(upRes){
        if(upRes.error){ statusEl.textContent = 'Gagal upload: ' + upRes.error.message; return; }
        var pub = sb.storage.from(BUCKET).getPublicUrl(path);
        var url = pub.data.publicUrl;
        return sb.from('pz_images').upsert([{ key: key, url: url, updated_at: new Date().toISOString() }], { onConflict: 'key' }).then(function(res){
          if(res.error){ statusEl.textContent = 'Gagal simpan: ' + res.error.message; return; }
          imageUrls[key] = url;
          statusEl.textContent = 'Tersimpan ✓';
          var thumb = card.querySelector('.thumb');
          if(thumb && thumb.tagName === 'IMG'){ thumb.src = url; }
          var vstatus = card.querySelector('.vstatus');
          if(vstatus){ vstatus.innerHTML = '<a href="'+url+'" target="_blank">▶ Lihat video tersimpan</a>'; }
          setTimeout(function(){ statusEl.textContent=''; }, 2500);
        });
      });
    });
  });
}

function renderArticlesManager(){
  var html = '<div class="editor-head"><h2>Kelola Artikel Tambahan</h2>' +
    '<a href="artikel.html" target="_blank" class="btn ghost small">Lihat Halaman Artikel</a></div>' +
    '<p style="font-size:.88rem;color:var(--muted);margin-top:-8px;margin-bottom:18px;">' +
    'Artikel yang ditambahkan di sini otomatis muncul di halaman Artikel, di bawah 6 artikel draf yang sudah ada. ' +
    'Tidak perlu minta bantuan edit file lagi.</p>';

  html += '<div id="artFormHolder"></div>';

  html += '<div class="section-label">Daftar Artikel Tambahan</div>';
  if(!articles.length){
    html += '<div class="empty-state" style="padding:30px 10px;">Belum ada artikel tambahan. Klik "+ Tambah Artikel Baru" di atas.</div>';
  } else {
    articles.forEach(function(a){
      html += '<div class="artlist-item" data-artid="'+esc(a.id)+'">' +
        (a.image_url ? '<img src="'+esc(a.image_url)+'">' : '<div style="width:72px;height:52px;border-radius:6px;background:var(--sand);flex:0 0 auto;"></div>') +
        '<div class="info"><div class="ttl">'+esc(a.title_id||'(tanpa judul)')+'</div>' +
        '<div class="sub">'+esc(a.tag_id||'')+'</div></div>' +
        '<div class="acts">' +
        '<button type="button" class="btn ghost small" data-edit="'+esc(a.id)+'">Edit</button>' +
        '<button type="button" class="btn danger small" data-del="'+esc(a.id)+'">Hapus</button>' +
        '</div></div>';
    });
  }

  editorEl.innerHTML = html;
  renderArticleForm();

  editorEl.querySelectorAll('[data-edit]').forEach(function(b){
    b.addEventListener('click', function(){
      editingArticleId = b.getAttribute('data-edit');
      renderArticleForm();
      var holder = document.getElementById('artFormHolder');
      if(holder && holder.scrollIntoView){ holder.scrollIntoView({ behavior:'smooth', block:'start' }); }
    });
  });
  editorEl.querySelectorAll('[data-del]').forEach(function(b){
    b.addEventListener('click', function(){
      if(!confirm('Hapus artikel ini? Tindakan ini tidak bisa dibatalkan.')) return;
      var id = b.getAttribute('data-del');
      sb.from('pz_articles').delete().eq('id', id).then(function(res){
        if(res.error){ alert('Gagal hapus: ' + res.error.message); return; }
        articles = articles.filter(function(a){ return a.id !== id; });
        if(editingArticleId === id) editingArticleId = null;
        renderPageList();
        renderArticlesManager();
      });
    });
  });
}

function renderArticleForm(){
  var holder = document.getElementById('artFormHolder');
  if(!holder) return;
  var editing = editingArticleId ? articles.find(function(a){ return a.id === editingArticleId; }) : null;
  var heading = editing ? 'Edit Artikel' : '+ Tambah Artikel Baru';

  var editingTagId = editing ? (editing.tag_id || '') : '';
  var matchIdx = TAG_OPTIONS.findIndex(function(t){ return t.id === editingTagId; });
  var isCustomTag = editingTagId !== '' && matchIdx === -1;
  var selectValue = isCustomTag ? 'custom' : String(matchIdx !== -1 ? matchIdx : 0);

  var html = '<div class="artform">' +
    '<h3>'+heading+'</h3>' +
    '<div class="field"><label>Kategori / Tag</label>' +
    '<select id="artTagSelect" style="width:100%;font-family:inherit;font-size:.9rem;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;">' +
      TAG_OPTIONS.map(function(t,i){ return '<option value="'+i+'"'+(selectValue===String(i)?' selected':'')+'>'+esc(t.id)+'</option>'; }).join('') +
      '<option value="custom"'+(selectValue==='custom'?' selected':'')+'>Lainnya (isi manual)…</option>' +
    '</select>' +
    '<div class="row2" id="artTagCustomWrap" style="display:'+(selectValue==='custom'?'grid':'none')+';margin-top:8px;">' +
      '<input type="text" id="artTagId" placeholder="Kategori (ID)" value="'+esc(isCustomTag?editingTagId:'')+'">' +
      '<input type="text" id="artTagEn" placeholder="Category (EN)" value="'+esc(isCustomTag?(editing.tag_en||''):'')+'">' +
    '</div></div>' +
    '<div class="field"><label>Judul</label>' +
    '<div class="row2">' +
      '<input type="text" id="artTitleId" placeholder="Judul (ID)" value="'+esc(editing?editing.title_id:'')+'">' +
      '<input type="text" id="artTitleEn" placeholder="Title (EN)" value="'+esc(editing?editing.title_en:'')+'">' +
    '</div></div>' +
    '<div class="field"><label>Ringkasan/Isi Singkat</label>' +
    '<div class="row2">' +
      '<textarea id="artExcId" rows="4" placeholder="Isi (ID)">'+esc(editing?editing.excerpt_id:'')+'</textarea>' +
      '<textarea id="artExcEn" rows="4" placeholder="Content (EN)">'+esc(editing?editing.excerpt_en:'')+'</textarea>' +
    '</div></div>' +
    '<div class="field"><label>Isi Lengkap Artikel (dibuka lewat tombol &quot;Baca selengkapnya&quot;; pisahkan paragraf dengan baris kosong)</label>' +
    '<div class="row2">' +
      '<textarea id="artBodyId" rows="8" placeholder="Isi lengkap (ID)">'+esc(editing?editing.body_id:'')+'</textarea>' +
      '<textarea id="artBodyEn" rows="8" placeholder="Full content (EN)">'+esc(editing?editing.body_en:'')+'</textarea>' +
    '</div></div>' +
    '<div class="field"><label>Link Video YouTube (opsional)</label>' +
    '<input type="text" id="artYoutube" placeholder="Tempel link YouTube, contoh: https://www.youtube.com/watch?v=xxxx" value="'+esc(editing?editing.youtube_url:'')+'">' +
    '</div>' +
    '<div class="field"><label>Gambar Artikel</label>' +
    '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">' +
      (editing && editing.image_url ? '<img src="'+esc(editing.image_url)+'" style="width:100px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);">' : '') +
      '<input type="file" id="artImageFile" accept="image/*">' +
      '<span class="ustatus" id="artImgStatus"></span>' +
    '</div></div>' +
    '<div class="actbar">' +
      '<button type="button" class="translatebtn" id="artTranslateBtn">↻ Terjemahkan judul &amp; isi dari ID</button>' +
      '<span style="flex:1;"></span>' +
      (editing ? '<button type="button" class="btn ghost small" id="artCancelBtn">Batal</button>' : '') +
      '<button type="button" class="btn primary small" id="artSaveBtn">'+(editing?'Simpan Perubahan':'Tambahkan Artikel')+'</button>' +
      '<span class="status" id="artFormStatus" style="font-size:.85rem;color:var(--muted);"></span>' +
    '</div>' +
    (editing ? '<input type="hidden" id="artPendingImageUrl" value="'+esc(editing.image_url||'')+'">' : '<input type="hidden" id="artPendingImageUrl" value="">') +
    '</div>';

  holder.innerHTML = html;

  document.getElementById('artTagSelect').addEventListener('change', function(){
    var wrap = document.getElementById('artTagCustomWrap');
    wrap.style.display = (this.value === 'custom') ? 'grid' : 'none';
  });

  document.getElementById('artImageFile').addEventListener('change', function(){
    var file = this.files && this.files[0];
    if(!file) return;
    var statusEl = document.getElementById('artImgStatus');
    statusEl.textContent = 'Mengunggah...';
    var ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    var path = 'articles/img-' + Date.now() + '.' + ext;
    sb.storage.from(BUCKET).upload(path, file, { upsert: true }).then(function(upRes){
      if(upRes.error){ statusEl.textContent = 'Gagal upload: ' + upRes.error.message; return; }
      var pub = sb.storage.from(BUCKET).getPublicUrl(path);
      document.getElementById('artPendingImageUrl').value = pub.data.publicUrl;
      statusEl.textContent = 'Tersimpan ✓';
      setTimeout(function(){ statusEl.textContent=''; }, 2000);
    });
  });

  function currentTag(){
    var sel = document.getElementById('artTagSelect').value;
    if(sel === 'custom'){
      return { id: document.getElementById('artTagId').value.trim(), en: document.getElementById('artTagEn').value.trim() };
    }
    var opt = TAG_OPTIONS[parseInt(sel, 10)] || TAG_OPTIONS[0];
    return { id: opt.id, en: opt.en };
  }

  document.getElementById('artTranslateBtn').addEventListener('click', function(){
    var btn = this;
    var titleId = document.getElementById('artTitleId').value.trim();
    var excId = document.getElementById('artExcId').value.trim();
    var isCustomSel = document.getElementById('artTagSelect').value === 'custom';
    var tagId = isCustomSel ? document.getElementById('artTagId').value.trim() : '';
    if(!titleId && !excId && !tagId && !document.getElementById('artBodyId').value.trim()) return;
    btn.disabled = true; btn.textContent = 'Menerjemahkan...';
    var translateOne = function(text){
      if(!text) return Promise.resolve('');
      return fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=id|en')
        .then(function(r){ return r.json(); })
        .then(function(d){ return (d && d.responseData && d.responseData.translatedText) || ''; })
        .catch(function(){ return ''; });
    };
    // Teks panjang dipecah per paragraf/kalimat (batas layanan gratis ±500 karakter) lalu digabung lagi.
    var translateLong = function(text){
      if(!text) return Promise.resolve('');
      var chunks = [];
      text.split(/\n\s*\n/).forEach(function(par, pi){
        var cur = '';
        (par.match(/[^.!?]+[.!?]*\s*/g) || [par]).forEach(function(sent){
          if((cur + sent).length > 450 && cur){ chunks.push({t:cur.trim(), p:pi}); cur = ''; }
          cur += sent;
        });
        if(cur.trim()) chunks.push({t:cur.trim(), p:pi});
      });
      var out = [], chain = Promise.resolve();
      chunks.forEach(function(c){
        chain = chain.then(function(){ return translateOne(c.t).then(function(r){ out.push({t:r||c.t, p:c.p}); }); });
      });
      return chain.then(function(){
        var pars = [];
        out.forEach(function(o){ pars[o.p] = (pars[o.p] ? pars[o.p] + ' ' : '') + o.t; });
        return pars.filter(Boolean).join('\n\n');
      });
    };
    var bodyId = document.getElementById('artBodyId').value.trim();
    Promise.all([translateOne(tagId), translateOne(titleId), translateOne(excId), translateLong(bodyId)]).then(function(res){
      if(res[0]) document.getElementById('artTagEn').value = res[0];
      if(res[1]) document.getElementById('artTitleEn').value = res[1];
      if(res[2]) document.getElementById('artExcEn').value = res[2];
      if(res[3]) document.getElementById('artBodyEn').value = res[3];
      btn.disabled = false; btn.textContent = '↻ Terjemahkan judul & isi dari ID';
    });
  });

  var cancelBtn = document.getElementById('artCancelBtn');
  if(cancelBtn){
    cancelBtn.addEventListener('click', function(){
      editingArticleId = null;
      renderArticleForm();
    });
  }

  document.getElementById('artSaveBtn').addEventListener('click', function(){
    var statusEl = document.getElementById('artFormStatus');
    var tag = currentTag();
    var row = {
      id: editing ? editing.id : ('art_' + Date.now()),
      tag_id: tag.id,
      tag_en: tag.en,
      title_id: document.getElementById('artTitleId').value.trim(),
      title_en: document.getElementById('artTitleEn').value.trim(),
      excerpt_id: document.getElementById('artExcId').value.trim(),
      excerpt_en: document.getElementById('artExcEn').value.trim(),
      body_id: document.getElementById('artBodyId').value.trim(),
      body_en: document.getElementById('artBodyEn').value.trim(),
      youtube_url: document.getElementById('artYoutube').value.trim() || null,
      image_url: document.getElementById('artPendingImageUrl').value || null,
    };
    if(!row.title_id){ statusEl.textContent = 'Judul (ID) wajib diisi.'; return; }
    statusEl.textContent = 'Menyimpan...';
    sb.from('pz_articles').upsert([row], { onConflict: 'id' }).then(function(res){
      if(res.error){ statusEl.textContent = 'Gagal: ' + res.error.message; return; }
      if(editing){
        var idx = articles.findIndex(function(a){ return a.id === row.id; });
        if(idx !== -1) articles[idx] = row; else articles.unshift(row);
      } else {
        articles.unshift(row);
      }
      editingArticleId = null;
      renderPageList();
      renderArticlesManager();
    });
  });
}

function autoGrow(){
  editorEl.querySelectorAll('textarea').forEach(function(t){
    t.style.height = 'auto';
    t.style.height = Math.min(t.scrollHeight, 300) + 'px';
    t.addEventListener('input', function(){
      t.style.height = 'auto';
      t.style.height = Math.min(t.scrollHeight, 300) + 'px';
    });
  });
}

function saveCurrentPage(){
  if(!currentPage || currentPage === ARTICLES_KEY) return;
  saveStatus.textContent = 'Menyimpan...';
  var cards = editorEl.querySelectorAll('.fieldcard');
  var rows = [];
  cards.forEach(function(card){
    var key = card.getAttribute('data-key');
    var idVal = card.querySelector('[data-lang="id"]').value;
    var enVal = card.querySelector('[data-lang="en"]').value;
    rows.push({ key: key, value_id: idVal, value_en: enVal, updated_at: new Date().toISOString() });
  });
  sb.from('pz_content').upsert(rows, { onConflict: 'key' }).then(function(res){
    if(res.error){
      saveStatus.textContent = 'Gagal: ' + res.error.message;
    } else {
      rows.forEach(function(r){ overrides[r.key] = { value_id: r.value_id, value_en: r.value_en }; });
      saveStatus.textContent = 'Tersimpan ✓';
      setTimeout(function(){ saveStatus.textContent=''; }, 2500);
    }
  });
}

document.getElementById('saveBtn').addEventListener('click', saveCurrentPage);

function loadManifestAndOverrides(){
  return Promise.all([
    fetch('content-manifest.json').then(function(r){ return r.json(); }),
    fetch('image-manifest.json').then(function(r){ return r.json(); }),
    sb.from('pz_content').select('key,value_id,value_en'),
    sb.from('pz_images').select('key,url'),
    sb.from('pz_articles').select('*').order('created_at', { ascending: false }),
  ]).then(function(results){
    manifest = results[0];
    imageManifest = results[1];
    var contentRes = results[2];
    var imagesRes = results[3];
    var articlesRes = results[4];
    articles = (articlesRes && articlesRes.data) || [];

    overrides = {};
    (contentRes.data||[]).forEach(function(row){ overrides[row.key] = { value_id: row.value_id, value_en: row.value_en }; });

    imageUrls = {};
    (imagesRes.data||[]).forEach(function(row){ imageUrls[row.key] = row.url; });

    imagesByPage = {};
    Object.keys(imageManifest).forEach(function(key){
      var im = imageManifest[key];
      var page = im.page;
      if(!imagesByPage[page]) imagesByPage[page] = [];
      imagesByPage[page].push({ key: key, label: im.label, kind: im.kind, defaultUrl: im.defaultUrl });
    });

    renderPageList();
  });
}

function showEditor(){
  loginView.style.display='none';
  editorView.style.display='flex';
  loadManifestAndOverrides();
}
function showLogin(){
  editorView.style.display='none';
  loginView.style.display='flex';
}

sb.auth.getSession().then(function(res){
  if(res.data && res.data.session){ showEditor(); } else { showLogin(); }
});

document.getElementById('loginBtn').addEventListener('click', function(){
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value;
  loginMsg.innerHTML = '';
  sb.auth.signInWithPassword({ email: email, password: pass }).then(function(res){
    if(res.error){
      loginMsg.innerHTML = '<div class="err">Gagal masuk: ' + res.error.message + '</div>';
    } else {
      showEditor();
    }
  });
});

document.getElementById('logoutBtn').addEventListener('click', function(){
  sb.auth.signOut().then(function(){ showLogin(); });
});
</script>
