<!DOCTYPE html><html lang="id" data-lang="id"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baca Artikel — Zero Waste &amp; Pandansimo</title>
<link rel="stylesheet" href="theme.css">
<style>
.reader{max-width:820px;margin:0 auto;}
.reader .cover{width:100%;max-height:420px;object-fit:cover;border-radius:var(--radius);margin-bottom:24px;}
.reader p{font-size:1.02rem;line-height:1.75;margin:0 0 18px;}
.video16x9{position:relative;padding-top:56.25%;border-radius:var(--radius);overflow:hidden;margin:8px 0 24px;background:#000;}
.video16x9 iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
</style>
</head>
<body data-page="artikel.html">

<div id="site-header"></div>

<div class="crumbs"><div class="wrap">
  <a href="index.html" lang="id">Beranda</a><a href="index.html" lang="en" hidden>Home</a>
  <span class="sep">/</span>
  <a href="artikel.html" lang="id">Artikel</a><a href="artikel.html" lang="en" hidden>Articles</a>
</div></div>

<section class="hero compact">
  <div class="wrap">
    <span class="eyebrow" id="rTag"></span>
    <h1 id="rTitle"></h1>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="reader" id="reader">
      <p lang="id">Memuat artikel…</p><p lang="en" hidden>Loading article…</p>
    </div>
    <p style="max-width:820px;margin:24px auto 0;"><a href="artikel.html"><span lang="id">← Kembali ke daftar artikel</span><span lang="en" hidden>← Back to articles</span></a></p>
  </div>
</section>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="shell.js"></script>
<script>
(function(){
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function paras(t){
    return String(t||'').split(/\n\s*\n/).filter(function(x){return x.trim();}).map(function(x){
      return '<p>'+esc(x.trim()).replace(/\n/g,'<br>')+'</p>';
    }).join('');
  }
  function ytId(u){
    if(!u) return null;
    var m = String(u).trim().match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }
  function applyLang(){
    var l = document.documentElement.getAttribute('data-lang') || 'id';
    document.body.querySelectorAll('#reader [lang="id"], .hero [lang="id"]').forEach(function(e){ e.hidden = (l !== 'id'); });
    document.body.querySelectorAll('#reader [lang="en"], .hero [lang="en"]').forEach(function(e){ e.hidden = (l !== 'en'); });
  }
  var readerEl = document.getElementById('reader');
  function notFound(){
    readerEl.innerHTML = '<p lang="id">Artikel tidak ditemukan.</p><p lang="en" hidden>Article not found.</p>';
    applyLang();
  }
  var id = new URLSearchParams(location.search).get('id');
  if(!id || !window.supabase || !window.ZW_SUPABASE_URL){ notFound(); return; }
  var sb = window.supabase.createClient(window.ZW_SUPABASE_URL, window.ZW_SUPABASE_KEY);
  sb.from('pz_articles').select('*').eq('id', id).maybeSingle().then(function(res){
    var a = res && res.data;
    if(!a){ notFound(); return; }
    document.title = (a.title_id || 'Artikel') + ' — Zero Waste & Pandansimo';
    var pair = function(idv, env){ return '<span lang="id">'+esc(idv)+'</span><span lang="en" hidden>'+esc(env || idv)+'</span>'; };
    document.getElementById('rTag').innerHTML = a.tag_id ? pair(a.tag_id, a.tag_en) : '';
    if(!a.tag_id) document.getElementById('rTag').style.display = 'none';
    document.getElementById('rTitle').innerHTML = pair(a.title_id, a.title_en);
    var html = '';
    if(a.image_url) html += '<img class="cover" src="'+esc(a.image_url)+'" alt="">';
    var yt = ytId(a.youtube_url);
    if(yt) html += '<div class="video16x9"><iframe src="https://www.youtube-nocookie.com/embed/'+yt+'" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>';
    var bodyId = a.body_id || a.excerpt_id, bodyEn = a.body_en || a.body_id || a.excerpt_en || a.excerpt_id;
    html += '<div lang="id">'+paras(bodyId)+'</div><div lang="en" hidden>'+paras(bodyEn)+'</div>';
    readerEl.innerHTML = html;
    applyLang();
  });
  document.addEventListener('click', function(e){
    if(e.target.closest('.langtoggle button')) setTimeout(applyLang, 0);
  });
})();
</script>
</body></html>
